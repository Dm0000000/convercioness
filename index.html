<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de temperatura</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="card">
        <h2>Conversor de temperatura</h2>
        
        <div class="input-group">
            <label for="tipoConversion">Selecciona la conversión:</label>
            <select id="tipoConversion">
                <option value="c-a-f">Celsius (°C) a Fahrenheit (°F)</option>
                <option value="f-a-c">Fahrenheit (°F) a Celsius (°C)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="temperatura">Temperatura:</label>
            <input type="number" id="temperatura" placeholder="Escribe los grados aquí">
        </div>

        <button id="btnConvertir">Convertir</button>
        
        <p id="resultado"></p>
    </div>
    
    <script src="temperaturas.js"></script>
</body>
</html>
